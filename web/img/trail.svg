<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-label="A map with a dotted trail linking four numbered stops to a golden star">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff4d6"/><stop offset="1" stop-color="#ffe3ec"/></linearGradient>
    <linearGradient id="hillA" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7bd88f"/><stop offset="1" stop-color="#3fb46a"/></linearGradient>
    <linearGradient id="hillB" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a5e6a3"/><stop offset="1" stop-color="#59c47c"/></linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000" flood-opacity=".22"/></filter>
  </defs>
  <rect width="640" height="400" rx="28" fill="url(#sky)"/>
  <!-- faint map grid -->
  <g stroke="#e8c99b" stroke-width="1" opacity=".55">
    <path d="M0 80H640M0 160H640M0 240H640M0 320H640"/><path d="M107 0V400M213 0V400M320 0V400M427 0V400M533 0V400"/>
  </g>
  <!-- sun -->
  <circle cx="560" cy="70" r="34" fill="#ffc83d"/>
  <g stroke="#ffc83d" stroke-width="6" stroke-linecap="round"><path d="M560 18v-10M560 122v10M508 70h-10M612 70h10M523 33l-7-7M597 107l7 7M597 33l7-7M523 107l-7 7"/></g>
  <!-- hills -->
  <path d="M0 400V300C90 240 170 250 250 290S410 330 500 280 600 260 640 280V400Z" fill="url(#hillB)"/>
  <path d="M0 400V340C100 300 190 320 280 350S470 380 640 330V400Z" fill="url(#hillA)"/>
  <!-- trees -->
  <g fill="#2f9e5e"><path d="M70 335l20-46 20 46z"/><path d="M80 320l10-26 10 26z" opacity=".0"/><path d="M118 345l15-36 15 36z"/><path d="M505 352l17-40 17 40z"/></g>
  <g fill="#7a4b2a"><rect x="86" y="335" width="8" height="14"/><rect x="129" y="345" width="8" height="12"/><rect x="518" y="352" width="8" height="12"/></g>
  <!-- the trail -->
  <path d="M70 300C120 250 150 210 215 215S300 270 355 235 420 150 470 150 540 130 565 92" fill="none" stroke="#fff" stroke-width="12" stroke-linecap="round" opacity=".85"/>
  <path d="M70 300C120 250 150 210 215 215S300 270 355 235 420 150 470 150 540 130 565 92" fill="none" stroke="#ff7a3d" stroke-width="6" stroke-linecap="round" stroke-dasharray="2 14"/>
  <!-- the stops -->
  <g filter="url(#soft)" font-family="Arial, Helvetica, sans-serif" font-weight="800" font-size="22" text-anchor="middle" fill="#fff">
    <g><circle cx="70" cy="300" r="24" fill="#0d6efd"/><text x="70" y="308">1</text></g>
    <g><circle cx="215" cy="215" r="24" fill="#12b886"/><text x="215" y="223">2</text></g>
    <g><circle cx="355" cy="235" r="24" fill="#e64980"/><text x="355" y="243">3</text></g>
    <g><circle cx="470" cy="150" r="24" fill="#f59f00"/><text x="470" y="158">4</text></g>
  </g>
  <!-- the prize -->
  <g filter="url(#soft)" transform="translate(565 92)">
    <circle r="36" fill="#fff"/>
    <path d="M0-26l7.6 16.6 18 2.1-13.3 12.4 3.6 17.8L0 13.3-15.9 22.9l3.6-17.8-13.3-12.4 18-2.1z" fill="#ffc83d" stroke="#e8a800" stroke-width="2" stroke-linejoin="round"/>
  </g>
  <!-- compass -->
  <g transform="translate(70 70)" filter="url(#soft)">
    <circle r="34" fill="#fff"/><circle r="29" fill="none" stroke="#dee2e6" stroke-width="2"/>
    <path d="M0-24L7 0 0 24-7 0z" fill="#e03131"/><path d="M0-24L7 0H-7z" fill="#e03131"/><path d="M0 24L7 0H-7z" fill="#495057"/>
    <circle r="3.5" fill="#fff" stroke="#495057" stroke-width="1.5"/>
  </g>
</svg>
