<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Site admin - Free Scavenger Hunt</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/bootstrap.min.css">
  <link rel="stylesheet" href="/css/site.css">
</head>
<body>
<nav class="admin-nav" id="nav" hidden></nav>
<main class="container page page-wide" id="app">
  <h1 class="h3">Site administration</h1>
  <section class="card card-body mb-4">
    <div class="form-check form-switch">
      <input class="form-check-input" type="checkbox" role="switch" id="registration-open" data-testid="registration-open">
      <label class="form-check-label" for="registration-open">Anyone can create an organiser account</label>
    </div>
  </section>
  <section class="mb-4">
    <h2 class="h5">Organisers</h2>
    <p class="alert alert-success" id="temp-password" role="status" hidden></p>
    <div class="table-responsive"><table class="table table-sm align-middle" data-testid="users-table"><thead><tr><th>user</th><th>hunts</th><th>limit</th><th>status</th><th></th></tr></thead><tbody id="users"></tbody></table></div>
  </section>
  <section>
    <h2 class="h5">All hunts</h2>
    <div class="table-responsive"><table class="table table-sm align-middle" data-testid="all-events"><thead><tr><th>hunt</th><th>organiser</th><th>status</th><th>day</th><th>teams</th></tr></thead><tbody id="all-events"></tbody></table></div>
  </section>
</main>
<footer class="site-footer" data-testid="site-footer">
  <div class="container">
    <span class="footer-made">Made in Perth, Western Australia</span>
    <nav class="footer-links" aria-label="Footer"><a href="/" data-testid="footer-home">Home</a><a href="/about/" data-testid="footer-about">About</a></nav>
  </div>
</footer>
<script type="module" src="/js/admin-site.js"></script>
</body>
</html>
