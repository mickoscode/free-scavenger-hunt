name: Terraform apply

# After a merge to main that touches terraform/: plan (read-only role), then an apply that waits for the
# administrator's approval in the terraform-production environment (write role, only assumable from that job).
on:
  push:
    branches: [main]
    paths:
      - "terraform/**"
      - ".github/workflows/terraform-apply.yml"
  workflow_dispatch:

concurrency:
  group: terraform-apply
  cancel-in-progress: false

permissions:
  contents: read

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

jobs:
  plan:
    name: Terraform plan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    outputs:
      has_changes: ${{ steps.plan.outputs.exitcode == '2' }}
    steps:
      - name: Checkout repository code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false

      - name: Configure AWS credentials (read-only plan role)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Terraform init
        working-directory: terraform
        run: terraform init

      - name: Terraform plan
        id: plan
        working-directory: terraform
        run: |
          set +e
          terraform plan -no-color -lock=false -detailed-exitcode 2>&1 | tee "$RUNNER_TEMP/plan.txt"
          code=${PIPESTATUS[0]}
          echo "exitcode=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" -eq 0 ] || [ "$code" -eq 2 ]; then exit 0; fi
          exit "$code"

      - name: Plan summary
        if: always() && steps.plan.outcome != 'skipped'
        env:
          EXIT_CODE: ${{ steps.plan.outputs.exitcode }}
        run: |
          plan="$RUNNER_TEMP/plan.txt"
          {
            echo "### Terraform plan (pending approval)"
            echo
            case "$EXIT_CODE" in
              0) echo "✅ **No changes.** The apply job will be skipped." ;;
              2) echo "📝 **Changes proposed:** $(grep -E '^Plan: ' "$plan" | tail -n1)"
                 echo
                 echo '```'
                 grep -E '^\s*# .* (will be|must be) ' "$plan" | sed -E 's/^\s+//' | head -n 100
                 echo '```'
                 echo
                 echo "Review, then approve the **apply** job (Review deployments) to proceed." ;;
              *) echo "❌ **Plan failed.** See the job log." ;;
            esac
          } >> "$GITHUB_STEP_SUMMARY"

  apply:
    name: Terraform apply
    needs: plan
    if: needs.plan.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      actions: write # to start the site deploy afterwards
    # Required reviewers on this environment are the manual approval gate (managed in terraform/bootstrap/github.tf).
    environment:
      name: terraform-production
    steps:
      - name: Checkout repository code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false

      - name: Configure AWS credentials (apply role)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_APPLY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Terraform init
        working-directory: terraform
        run: terraform init

      # Re-plans and applies in one step, so what was approved is what runs (the plan above is for review).
      - name: Terraform apply
        working-directory: terraform
        run: terraform apply -no-color -auto-approve 2>&1 | tee "$RUNNER_TEMP/apply.txt"; exit "${PIPESTATUS[0]}"

      - name: Apply summary
        if: always()
        run: |
          {
            echo "### Terraform apply"
            echo
            grep -E '^(Apply complete|Error:)' "$RUNNER_TEMP/apply.txt" 2>/dev/null | head -n 5
          } >> "$GITHUB_STEP_SUMMARY"

      # New or changed infrastructure may need the site published into it (a merge only runs the deploy workflow
      # when web/ changed, and the first deploy can only succeed once this apply has created the bucket).
      - name: Deploy site
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --repo "$GITHUB_REPOSITORY" --ref main
